# nginx reverse proxy for FastScript Wiki.
# Installed by install.sh as /etc/nginx/sites-available/fastscript-wiki.conf
# with __DOMAIN__ and __PORT__ substituted.

upstream fastscript_wiki {
  server 127.0.0.1:__PORT__;
}

server {
  listen 80;
  server_name __DOMAIN__;

  # Static alternative (no backend service):
  #   1) .venv/bin/mkdocs build -d /opt/fastscript-wiki/site
  #   2) replace this location block with:
  #        root /opt/fastscript-wiki/site;
  #        index index.html;
  #        try_files $uri $uri/ $uri.html =404;

  location / {
    proxy_pass http://fastscript_wiki;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
